name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.36.0.3)'
        required: false
        default: 'v2.36.0.3'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing aapt zipalign apksigner file zip unzip gzip gcc-aarch64-linux-gnu && break || sleep 5
          done

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Standard Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Build Region Bypass Release APK (dist/antigravity-region-bypass.apk)
        run: |
          bash build.sh --region-bypass

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-region-bypass.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0} (Core 2.36.0)', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>Antigravity for Android &bull; Core 2.36.0</h3>
              <p>Autonomous AI Coding Environment &bull; Native Bionic Userspace &bull; ARM64</p>
            </div>

            ---

            ### Packages & Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`antigravity.apk`** | Standard production release with native bionic engine (com.agy, port 45157) |
            | **`antigravity-region-bypass.apk`** | Region bypass edition with account eligibility check bypass (com.agy, port 45157) |
            | **`SHA256SUMS.txt`** | Cryptographic checksums for package integrity verification |

            ---

            ### What's New in v2.36.0.3 (Antigravity 2.36.0)

            * **4-Part `CORE.APP_REV` Versioning (`2.36.0.3` / `versionCode=2360003`):** Adopts upstream's `<CORE_VERSION>.<APP_REV>` convention so the Antigravity core version (`2.36.0`) is visible in Android App Info, APK installer, and GitHub tags, while upgrading cleanly in-place over both `v2.36.2` and upstream `v2.36.0.2`.
            * **Shizuku Manager Visibility (`API_V23` + `V3_SUPPORT`):** Includes both `moe.shizuku.manager.permission.API_V23` and `moe.shizuku.client.V3_SUPPORT` manifest metadata for Shizuku Manager **Authorized applications** listing.
            * **Auto-Refresh `AGENTS.md` on Upgrade & Release Notes Fix:** `OnboardingSeeder` refreshes `~/.gemini/config/AGENTS.md` whenever `APP_VERSION_CODE` increments, and `UpdateChecker` displays `### What's New` directly in the in-app update dialog.
            * **Dynamic Masked Patches:** Integrates upstream dynamic masked matching for `crash_suppressor`, `pidfd`, and `web/patch_main.py`.

            ### Fork Highlights (Preserved)

            * **Google OAuth Account Chooser & Redirect Fix:** Enforces `prompt=select_account` (stripping `login_hint`/`authuser`) via `GoogleOAuthUrlRewriter` for Gmail/Google Workspace plugin logins, plus local `REDIRECT` mode on localhost.
            * **Optional Project Folder Deletion:** Unchecked-by-default **"Also delete project folder from storage"** checkbox in the Delete Project dialog backed by path-safe `ProjectFolderDeleter.java`.
            * **Swarm Reliability & UX:** Dynamic `node` bridge, `nodejs-lts` auto-seeding, `pkg` fallback wrapper overwrite, post-startup `builtin/plugins` sync, Swarm Graph/Hive GPU ghosting & Live-mode anti-blinking fixes, and Swarm UI quick-open chip in the chat composer toolbar.
            * **Background Continuity, Notifications & Navigation:** Keeps WebView renderer at `IMPORTANT` priority with host-resume stalled stream reset; wires `window.nativeNotifications` + Background Assistant Reply Watcher with Android 13+ `POST_NOTIFICATIONS` and direct deep-link; step-by-step Android Back + 1-step header `←` Back; bundled multi-account `GitHub (Local)` plugin with direct browser Device Flow login; Plugins mobile CSS; and automated upstream sync CI.

            ### Foundation Highlights

            * **Built-in Web Terminal & PTY Support (PR #19):** Enabled native built-in web terminal on Android userspace via length-preserving PTY shell binary patching (`/bin/bash` -> `/bin///sh`), prioritized shell fallback hierarchy (`$PREFIX/bin/bash` -> `runtime/bin/bash` -> `/system/bin/sh`), and proper `TERM=xterm-256color` / `TERMINFO` configuration.
            * **ARMv8.0-A CPU & SIMD Emulation (`liblse_compat.so`):** Transparent `SIGILL` emulation for `FEAT_LSE`, `FEAT_RDM`, `FEAT_LRCPC`, and `FEAT_FCMA` on Snapdragon 680/685 / Cortex-A53 devices.
            * **Universal Media & File Picker + Micro-Daemon:** Persistent URI intent picker for images/videos/files, hardware `torch` bridge, and lightweight background scheduler (`agy-daemon` / `agy-notify`).

            ---

            > [!NOTE]
            > **Seamless Upgrades:** Built with the consistent embedded signing keystore (`APP_VERSION_CODE=2360003`). You can install this update directly over previous v2.x/v3.x releases without uninstalling or losing local projects.
