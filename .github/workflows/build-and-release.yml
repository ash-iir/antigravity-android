name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.34.0)'
        required: false
        default: 'v2.34.13'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing aapt zipalign apksigner file zip unzip gzip gcc-aarch64-linux-gnu && break || sleep 5
          done

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Standard Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Build Region Bypass Release APK (dist/antigravity-region-bypass.apk)
        run: |
          bash build.sh --region-bypass

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-region-bypass.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>Antigravity for Android</h3>
              <p>Autonomous AI Coding Environment &bull; Native Bionic Userspace &bull; ARM64</p>
            </div>

            ---

            ### Packages & Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`antigravity.apk`** | Standard production release with native bionic engine (com.agy, port 45157) |
            | **`antigravity-region-bypass.apk`** | Region bypass edition with account eligibility check bypass (com.agy, port 45157) |
            | **`SHA256SUMS.txt`** | Cryptographic checksums for package integrity verification |

            ---

            ### What's New in v2.34.13

            * **Clean UI Overlay:** Removed the floating `AGY` pill and `QuickControlSheet` (`Antigravity Control`) modal overlay for an unobstructed chat workspace.
            * **Faster `pkg` Package Manager (`pkg_core.py`):** Mtime-cached `dpkg`/`Packages` indexing, full DFS dependency & upgrade planning with disk-space preflight, conditional `curl -z` updates, parallel `curl -Z --http2` downloads with per-file SHA256 mirror fallback, single-pass staged `.deb` validation/extraction with byte-length-preserving ELF prefix rewriting, `--keep-cache` flag, and de-prioritized `tuna` fallback in `repo.conf`.
            * **Security Hardening & Lifecycle Stability:** Per-boot bearer token auth in `SystemGatewayServer`, token gating on mutating `AndroidBridge` calls, bounded `/exec` concurrency and timeouts, loopback core TLS pinning in WebView, persistent `fcntl.flock` on `daemon.lock` + deduplicated logging in `agy-daemon`, `SplashController` WebView teardown on dismiss, clickable `ForegroundNotification` resume intent, and capped crash/stderr logs.
            * **Root, Chat Media & Update Checker:** Passive 24h `UpdateChecker`, clipboard/IME image paste in chat, native `RootBridge`/`RootResilience` (`agy-root`, `su`, `sudo`, `agy-sys`), and hardened Go TLS/DNS + `FileDownloader` blob spill recovery.

            ### Foundation Highlights

            * **Built-in Web Terminal & PTY Support (PR #19):** Enabled native built-in web terminal on Android userspace via length-preserving PTY shell binary patching (`/bin/bash` -> `/bin///sh`), prioritized shell fallback hierarchy (`$PREFIX/bin/bash` -> `runtime/bin/bash` -> `/system/bin/sh`), and proper `TERM=xterm-256color` / `TERMINFO` configuration.
            * **ARMv8.0-A CPU & SIMD Emulation (`liblse_compat.so`):** Transparent `SIGILL` emulation for `FEAT_LSE`, `FEAT_RDM`, `FEAT_LRCPC`, and `FEAT_FCMA` on Snapdragon 680/685 / Cortex-A53 devices.
            * **Universal Media & File Picker + Micro-Daemon:** Persistent URI intent picker for images/videos/files, hardware `torch` bridge, and lightweight background scheduler (`agy-daemon` / `agy-notify`).

            ---

            > [!NOTE]
            > **Seamless Upgrades:** Built with the consistent embedded signing keystore (`APP_VERSION_CODE=23413`). You can install this update directly over previous v2.x releases without uninstalling or losing local projects.
